board.before=  BEFORE
board.after=AFTER

prompt.dice=  Dice: {0}
prompt.used=  Used: {0}
prompt.left=  Left:  {0}
prompt.moves=  Available moves:
prompt.choose=  > 
prompt.range=  Enter a number between {0} and {1}
prompt.invalid=  Invalid input

move.place=Place new pawn on corner
move.placeKill=Place new pawn on corner [KILL!]
move.placeMove=Place new pawn + move {0} steps
move.placeMoveKill=Place new pawn + move {0} steps [KILL!]
move.pawn=Pawn {0}.{1} -> {2} steps
move.kill= [KILL!]
move.home= [HOME!]
move.win= [WIN!]
