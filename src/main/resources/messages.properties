# Default (English) message bundle for peshki.
# Keys are referenced from ru.anseranser.peshki.i18n.Messages.

event.rolled=  Rolled: {0}
event.placed=  Placed new pawn on corner
event.moved=  Pawn {0}.{1} moved {2} steps
event.killed=  Pawn {0}.{1} killed {2}.{3}
event.enteredHome=  Pawn {0}.{1} entered home
event.rejected=  Move rejected: {0}

game.won=Player {0} wins!
game.ended=Game ended after {0} turns.

turn.header==== Turn {0} | Player {1} {2} ===
